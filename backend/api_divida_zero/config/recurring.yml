development:
  generate_daily_ai_message:
    class: GenerateDailyAiMessageJob
    schedule: "0 7 * * *"
  generate_due_alerts:
    class: GenerateDueAlertsJob
    schedule: "0 */6 * * *"
  generate_weekly_summary_alerts:
    class: GenerateWeeklySummaryAlertsJob
    schedule: "0 9 * * 5"

production:
  generate_daily_ai_message:
    class: GenerateDailyAiMessageJob
    schedule: "0 7 * * *"
  generate_due_alerts:
    class: GenerateDueAlertsJob
    schedule: "0 */6 * * *"
  generate_weekly_summary_alerts:
    class: GenerateWeeklySummaryAlertsJob
    schedule: "0 9 * * 5"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  sync_whatsapp_templates:
    class: WhatsappTemplateSyncJob
    schedule: "0 6 * * *"

  reset_whatsapp_daily_cap:
    class: WhatsappDailyCapResetJob
    schedule: "0 0 * * *"

  monitor_whatsapp_quality:
    class: WhatsappQualityMonitorJob
    schedule: "0 8 * * *"

  cleanup_imported_transaction_data:
    class: CleanupImportedTransactionDataJob
    schedule: "0 3 * * 1"
